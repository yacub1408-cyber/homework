<!DOCTYPE html>
<html class="page" lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="shortcut icon" href="./icons/favicon.svg">
    <script src="./js/index.js" type="module"></script>
    <title>Nike Air Mag</title>
</head>

<body class="page__body">
    <header class="header">
        <div class="container header__container">
            <a href="/" class="logo header__logo">
                <img class="logo__img" src="./icons/logo.svg" alt="логотип Nike">
            </a>
            <nav class="menu header__menu " id="header__menu" aria-label="Главное меню">
                <ul class="menu__list">
                    <li class="menu__item">
                        <a class="menu__link" href="#air-mag" lang="en">Air Mag</a>
                    </li>
                    <li class="menu__item">
                        <a class="menu__link" href="#sizes">Размеры</a>
                    </li>
                    <li class="menu__item">
                        <a class="menu__link" href="#characteristics">Характеристики</a>
                    </li>
                    <li class="menu__item">
                        <a class="menu__link" href="top-models">Другие ТОП модели</a>
                    </li>
                </ul>
            </nav>
            <div class="header__controls">
                <a href="#" class="header__order">Сделать заказ</a>
                <div class="header__actions">
                    <button class="header__actions-button" title="поиск" aria-label="поиск">
                        <svg width="24" height="24">
                            <use class="header__actions-icon" href="./icons/sprite.svg#search">
                            </use>
                        </svg>
                    </button>
                    <button class="header__actions-button" title="корзина" aria-label="корзина">
                        <svg width="24" height="24">
                            <use class="header__actions-icon" href="./icons/sprite.svg#cart">
                            </use>
                        </svg>
                    </button>
                    <button class="header__burger burger" aria-label="открыть меню" aria-expanded="false"
                        aria-controls="header__menu">
                        <svg width="24" height="24">
                            <use class="burger__icon-menu" href="./icons/sprite.svg#menu-burger">
                            </use>
                            <use class="burger__icon-cross" href="./icons/sprite.svg#menu-cross">
                            </use>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <section class="hero">
            <div class="container hero__container">
                <header class="hero__header">
                    <ul class="hero__benefits-list">
                        <li class="hero__benefits-item">стиль</li>
                        <li class="hero__benefits-item">скорость</li>
                    </ul>
                    <h1 class="hero__title">Nike <span class="hero__title-accent">Air</span> Mag</h1>
                </header>
                <img class="hero__img" src="./images/nike-air-mag-1.png" width="846" height="713"
                    alt="кроссовок Nike Air Mag">
                <footer class="hero__footer">
                    <a href="more-details" class="hero__footer-details">подробнее
                        <svg width="24" height="24">
                            <use class="hero__details-icon" href="./icons/main-sprite.svg#arrow-right">
                            </use>
                        </svg>
                    </a>
                </footer>
            </div>
        </section>
    </main>
</body>

</html>
