<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeraVla edu!</title>
    <link rel="stylesheet" href="./css/base/globals.css">
    <link rel="stylesheet" href="./css/index.css">
    <link href="./css/blocks/forms.css" rel="stylesheet">
    <link href="./css/base/vars.css" rel="stylesheet">
</head>

<body class="body">
    <div class="form__modal">
        <form>
            <h3 class="form__text text"><span class="form__title-accent">Записаться </span> на ознакомительный вебинар
            </h3>
            <div class="form__inputs">
                <label>
                    Ваше ФИО
                    <input type="text" placeholder="Иванов Иван Иванович">
                </label>
                <label>
                    Номер телефона
                    <input type="tel" placeholder="8 (___) ___-__-__">
                </label>
                <label>
                    Ваш email
                    <input type="email" placeholder="your_email@example.com">
                </label>
                <label>
                    Дата вебинара
                    <input type="date">
                </label>
                <a href="#" class="form__submit-button">Записаться</a>
            </div>
        </form>

    </div>
</body>

</html>
